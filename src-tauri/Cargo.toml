[package]
name = "epikodi"
version = "0.1.0"
edition = "2021"

[lib]
name = "epikodi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
libmpv2 = "7.0.1"
smb = "0.12"
axum = "0.8"
tokio = { version = "1", features = ["net", "sync"] }
futures-util = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
rand = "0.9"
percent-encoding = "2"
